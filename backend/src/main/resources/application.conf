ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [p2pgate.backend.api.ServerKt.module]
    }
}

backend {
    # All settings are overridable via environment variables (P2P_*), see Server.kt.
    operator-key = ${?P2P_OPERATOR_KEY}
    webhook-url = ${?P2P_ESCALATION_WEBHOOK}
    network = "mainnet"           # or "testnet"
    mix-ready = 0                 # pre-mixed USE reserve (base units)
    fee-bps = 0                   # protocol fee in bps (25-100 in production; 0 in bootstrap)
    collateral-token-id = ""      # 32-byte hex USE token id
    courier-id = "courier-dev-1"
    courier-pubkey = ""           # 33-byte compressed secp256k1 hex
    poll-delay-ms = 30000
}
