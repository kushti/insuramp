# AndroidX is required by the :app Compose modules. JVM-only modules
# (contracts, backend, e2e, :apps:core:*) are unaffected by these flags.
android.useAndroidX=true
android.nonTransitiveRClass=true

# The Android dexing/linking passes need more than the 512 MiB default.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
